name: M3 Spatial Graph P3 P4 Real After Effects

on:
  workflow_dispatch:
    inputs:
      afterfx_path:
        description: Optional explicit path to AfterFX.exe
        required: false
        type: string
      accepted_p1_p2_run_id:
        description: Accepted spatial P1/P2 workflow run ID
        required: false
        default: "34182897797"
        type: string
  push:
    branches:
      - ae-test/m3-spatial-graph-p3-p4-control
    paths:
      - .github/ae-test-trigger/m3-spatial-graph-p3-p4.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: editflow-m3-spatial-graph-p3-p4-real-ae-workstation
  cancel-in-progress: false

jobs:
  real-ae-spatial-graph-p3-p4:
    runs-on: [self-hosted, Windows, editflow-ae]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download accepted spatial P1 P2 artifact
        uses: actions/download-artifact@v4
        with:
          name: m3-spatial-graph-p1-p2-proof-${{ inputs.accepted_p1_p2_run_id || '34182897797' }}
          path: .accepted/m3-spatial-graph-p1-p2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.accepted_p1_p2_run_id || '34182897797' }}

      - name: Run isolated M3 spatial-graph P3/P4 proof
        shell: cmd
        env:
          EDITFLOW_AFTERFX_PATH: ${{ inputs.afterfx_path }}
        run: |
          @echo off
          if defined EDITFLOW_AFTERFX_PATH (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\run-m3-spatial-graph-p3-p4-self-hosted.ps1" -AfterFxPath "%EDITFLOW_AFTERFX_PATH%" -AcceptedP1P2Path ".\.accepted\m3-spatial-graph-p1-p2\result.json"
          ) else (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\run-m3-spatial-graph-p3-p4-self-hosted.ps1" -AcceptedP1P2Path ".\.accepted\m3-spatial-graph-p1-p2\result.json"
          )

      - name: Upload P3 P4 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-spatial-graph-p3-p4-proof-${{ github.run_id }}
          path: proofs/artifacts/m3-spatial-graph-p3-p4/
          if-no-files-found: warn
          retention-days: 14
