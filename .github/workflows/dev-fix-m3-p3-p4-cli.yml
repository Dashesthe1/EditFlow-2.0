name: Dev fix M3 mask P3 P4 CLI lifecycle

on:
  push:
    branches:
      - feature/m3-mask-p3-p4-proof
    paths:
      - .github/ae-test-trigger/dev-m3-p3-p4-fix.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-mask-p3-p4-proof
          fetch-depth: 0
      - name: Patch lifecycle issues found by CI/review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/desktop-host/src/m3-mask-p3-p4-cli.ts')
          s = p.read_text(encoding='utf-8')

          state_needle = '''  let baselineFingerprint: string | null = null;\n  let baselineItemCount: number | null = null;\n'''
          state_replacement = '''  let baselineFingerprint: string | null = null;\n  let baselineItemCount: number | null = null;\n  let panelHostName: string | null = null;\n  let panelHostVersion: string | null = null;\n  let panelHostBuild: string | null = null;\n  let panelExtensionVersion: string | null = null;\n  let panelSelectedProtocolVersion: string | null = null;\n  let panelSupportedProtocolVersions: readonly string[] | null = null;\n'''
          if state_needle not in s:
              raise SystemExit('Panel state insertion seam not found.')
          s = s.replace(state_needle, state_replacement, 1)

          panel_needle = '''    const panel = await broker.waitForPanel(timeoutMs);\n    checks.panel_negotiated_v12 = panel.protocolVersion === AE_MASK_PROTOCOL_VERSION_V12;'''
          panel_replacement = '''    const panel = await broker.waitForPanel(timeoutMs);\n    panelHostName = panel.hostName;\n    panelHostVersion = panel.hostVersion;\n    panelHostBuild = panel.hostBuild;\n    panelExtensionVersion = panel.extensionVersion;\n    panelSelectedProtocolVersion = panel.protocolVersion;\n    panelSupportedProtocolVersions = [...panel.supportedProtocolVersions];\n    checks.panel_negotiated_v12 = panel.protocolVersion === AE_MASK_PROTOCOL_VERSION_V12;'''
          if panel_needle not in s:
              raise SystemExit('Panel capture seam not found.')
          s = s.replace(panel_needle, panel_replacement, 1)

          render_needle = '''    checks.p3_animated_mask_structural = Array.isArray(animatedMask?.["pathKeyframes"])\n      && (animatedMask?.["pathKeyframes"] as unknown[]).length === 3;\n\n    const visualCompletion = await renderComp(visualRenderPath);'''
          render_replacement = '''    checks.p3_animated_mask_structural = Array.isArray(animatedMask?.["pathKeyframes"])\n      && (animatedMask?.["pathKeyframes"] as unknown[]).length === 3;\n\n    // Protocol 1.2 mask mutations advance AE state outside the M2 client cache.\n    // Refresh before returning to the accepted 1.1 render route so stale-state\n    // protection remains active rather than being bypassed.\n    await refreshState();\n    const visualCompletion = await renderComp(visualRenderPath);'''
          if render_needle not in s:
              raise SystemExit('M3-to-M2 refresh seam not found.')
          s = s.replace(render_needle, render_replacement, 1)

          stop_block = '''    if (broker !== null) {\n      try { await broker.stop(); } catch (error) {\n        cleanupErrors.push(`broker stop: ${error instanceof Error ? error.message : String(error)}`);\n      }\n    }\n\n'''
          if stop_block not in s:
              raise SystemExit('Broker stop block not found.')
          s = s.replace(stop_block, '', 1)

          final_block_needle = '''      } catch (error) {\n        cleanupErrors.push(`final inspect: ${error instanceof Error ? error.message : String(error)}`);\n        cleanupComplete = false;\n      }\n    }\n\n    const ok = failureError === null'''
          final_block_replacement = '''      } catch (error) {\n        cleanupErrors.push(`final inspect: ${error instanceof Error ? error.message : String(error)}`);\n        cleanupComplete = false;\n      }\n    }\n\n    // Keep the authenticated loopback broker alive through final cleanup/readback.\n    // Stopping it earlier would make the final baseline verification impossible.\n    if (broker !== null) {\n      try { await broker.stop(); } catch (error) {\n        cleanupErrors.push(`broker stop: ${error instanceof Error ? error.message : String(error)}`);\n      }\n    }\n\n    const ok = failureError === null'''
          if final_block_needle not in s:
              raise SystemExit('Final inspect seam not found.')
          s = s.replace(final_block_needle, final_block_replacement, 1)

          environment_needle = '''      environment: {\n        host: panel?.hostName ?? null,\n        hostVersion: panel?.hostVersion ?? null,\n        hostBuild: panel?.hostBuild ?? null,\n        extensionVersion: panel?.extensionVersion ?? null,\n        selectedProtocolVersion: panel?.protocolVersion ?? null,\n        supportedProtocolVersions: panel?.supportedProtocolVersions ?? null,\n      },'''
          environment_replacement = '''      environment: {\n        host: panelHostName,\n        hostVersion: panelHostVersion,\n        hostBuild: panelHostBuild,\n        extensionVersion: panelExtensionVersion,\n        selectedProtocolVersion: panelSelectedProtocolVersion,\n        supportedProtocolVersions: panelSupportedProtocolVersions,\n      },'''
          if environment_needle not in s:
              raise SystemExit('Final environment seam not found.')
          s = s.replace(environment_needle, environment_replacement, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EditFlow M3 P3-P4 Fixer'
          git config user.email 'editflow-builder@users.noreply.github.com'
          git add apps/desktop-host/src/m3-mask-p3-p4-cli.ts
          git commit -m 'fix: harden M3 P3/P4 proof state and cleanup lifecycle'
          git push origin HEAD:feature/m3-mask-p3-p4-proof
