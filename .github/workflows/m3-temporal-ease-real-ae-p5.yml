name: M3 Temporal Ease P5 Real AE Transfer

on:
  push:
    branches:
      - ae-test/m3-temporal-ease-p5-control
    paths:
      - .github/ae-test-trigger/m3-temporal-ease-p5.txt

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  m3-temporal-ease-p5-real-ae:
    runs-on: [self-hosted, Windows, editflow-ae]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        shell: cmd
        run: npm install

      - name: Require retained P1-P4 acceptance gate
        shell: cmd
        run: |
          @if not exist "proofs\diagnostics\m3-temporal-ease-p1-p4-acceptance.json" (
            @echo Temporal-ease P5 is intentionally blocked until independently reviewed protocol-1.8 P1-P4 acceptance is committed.
            @exit /b 1
          )

      - name: Run isolated M3 temporal-ease P5 transfer proof
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\windows\run-m3-temporal-ease-p5-self-hosted.ps1 -TimeoutSeconds 180

      - name: Upload M3 temporal-ease P5 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-temporal-ease-p5-proof-${{ github.run_id }}
          path: |
            proofs/artifacts/m3-temporal-ease-p5-transfer/**
          if-no-files-found: warn