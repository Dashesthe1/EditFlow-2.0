name: M3 Human Parity Exit Gate P3 Fastlane
on:
  push:
    branches: [ae-test/m3-human-parity-exit-gate-control]
    paths: [.github/ae-test-trigger/m3-human-parity-exit-gate-p3.txt]
permissions:
  contents: read
concurrency:
  group: editflow-accelerated-real-ae-workstation
  cancel-in-progress: false
jobs:
  exit-gate-p3:
    runs-on: [self-hosted, Windows, editflow-ae]
    timeout-minutes: 2
    steps:
      - name: Sync persistent M3 exit-gate source
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $r=Join-Path $env:LOCALAPPDATA "EditFlow2\warm-runner\EditFlow-2.0"
          git -C $r fetch --depth=1 origin m3/human-parity-exit-gate
          if($LASTEXITCODE -ne 0){throw "fetch failed"}
          git -C $r reset --hard FETCH_HEAD
          if($LASTEXITCODE -ne 0){throw "reset failed"}
          "EDITFLOW_FAST_REPO_ROOT=$r"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run warm integrated M3 exit-gate P3 proof
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:EDITFLOW_FAST_REPO_ROOT "scripts\windows\run-m3-human-parity-exit-gate-p3-warm.ps1")
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Upload M3 exit-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-human-parity-exit-gate-p3-${{ github.run_id }}
          path: ${{ env.EDITFLOW_FAST_REPO_ROOT }}\proofs\artifacts\m3-human-parity-exit-gate-p3\
          if-no-files-found: warn
          retention-days: 30
