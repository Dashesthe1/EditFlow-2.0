name: M3 Marker Motion P3 P4 Real After Effects

on:
  workflow_dispatch:
    inputs:
      afterfx_path:
        description: Optional explicit path to AfterFX.exe
        required: false
        type: string
  push:
    branches:
      - ae-test/m3-marker-motion-p3-p4
    paths:
      - .github/ae-test-trigger/m3-marker-motion-p3-p4.txt

permissions:
  contents: read

concurrency:
  group: editflow-m3-marker-motion-p3-p4-real-ae-workstation
  cancel-in-progress: false

jobs:
  real-ae-marker-motion-p3-p4:
    runs-on: [self-hosted, Windows, editflow-ae]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Re-prove accepted marker-motion P1/P2 in this workspace
        shell: cmd
        env:
          EDITFLOW_AFTERFX_PATH: ${{ github.event.inputs.afterfx_path }}
        run: |
          @echo off
          if defined EDITFLOW_AFTERFX_PATH (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\run-m3-marker-motion-self-hosted.ps1" -AfterFxPath "%EDITFLOW_AFTERFX_PATH%"
          ) else (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\run-m3-marker-motion-self-hosted.ps1"
          )

      - name: Run isolated marker-motion P3/P4 proof
        shell: cmd
        env:
          EDITFLOW_AFTERFX_PATH: ${{ github.event.inputs.afterfx_path }}
        run: |
          @echo off
          if defined EDITFLOW_AFTERFX_PATH (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\run-m3-marker-motion-p3-p4-self-hosted.ps1" -AfterFxPath "%EDITFLOW_AFTERFX_PATH%"
          ) else (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\run-m3-marker-motion-p3-p4-self-hosted.ps1"
          )

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-marker-motion-p3-p4-proof-${{ github.run_id }}
          path: |
            proofs/artifacts/m3-marker-motion-p1-p2/
            proofs/artifacts/m3-marker-motion-p3-p4/
          if-no-files-found: warn
          retention-days: 14
