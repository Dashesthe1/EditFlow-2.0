name: M3 Marker Motion P3 P4 Real After Effects

on:
  workflow_dispatch:
    inputs:
      afterfx_path:
        description: Optional explicit path to AfterFX.exe
        required: false
        type: string
      accepted_p1_p2_run_id:
        description: Accepted marker-motion P1/P2 workflow run ID
        required: false
        default: "34286914057"
        type: string
  push:
    branches:
      - ae-test/m3-marker-motion-p3-p4-control
    paths:
      - .github/ae-test-trigger/m3-marker-motion-p3-p4.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: editflow-m3-marker-motion-p3-p4-real-ae-workstation
  cancel-in-progress: false

jobs:
  real-ae-marker-motion-p3-p4:
    runs-on: [self-hosted, Windows, editflow-ae]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download accepted marker-motion P1 P2 artifact
        uses: actions/download-artifact@v4
        with:
          name: m3-marker-motion-p1-p2-proof-${{ inputs.accepted_p1_p2_run_id || '34286914057' }}
          path: .accepted/m3-marker-motion-p1-p2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.accepted_p1_p2_run_id || '34286914057' }}

      - name: Prepare reversible AE disk-cache guard
        shell: cmd
        env:
          EDITFLOW_AFTERFX_PATH: ${{ inputs.afterfx_path }}
        run: |
          @echo off
          if defined EDITFLOW_AFTERFX_PATH (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\manage-ae-proof-cache.ps1" -Mode Prepare -AfterFxPath "%EDITFLOW_AFTERFX_PATH%" -StatePath "%RUNNER_TEMP%\EditFlow2-m3-marker-motion-cache-guard.json" -EvidencePath ".\proofs\artifacts\m3-marker-motion-p3-p4\ae-cache-guard.json"
          ) else (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\manage-ae-proof-cache.ps1" -Mode Prepare -StatePath "%RUNNER_TEMP%\EditFlow2-m3-marker-motion-cache-guard.json" -EvidencePath ".\proofs\artifacts\m3-marker-motion-p3-p4\ae-cache-guard.json"
          )

      - name: Run isolated M3 marker-motion P3/P4 proof
        shell: cmd
        env:
          EDITFLOW_AFTERFX_PATH: ${{ inputs.afterfx_path }}
        run: |
          @echo off
          if defined EDITFLOW_AFTERFX_PATH (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\run-m3-marker-motion-p3-p4-self-hosted.ps1" -AfterFxPath "%EDITFLOW_AFTERFX_PATH%" -AcceptedP1P2Path ".\.accepted\m3-marker-motion-p1-p2\result.json"
          ) else (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\run-m3-marker-motion-p3-p4-self-hosted.ps1" -AcceptedP1P2Path ".\.accepted\m3-marker-motion-p1-p2\result.json"
          )

      - name: Restore exact AE preferences after proof
        if: always()
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\manage-ae-proof-cache.ps1" -Mode Restore -StatePath "%RUNNER_TEMP%\EditFlow2-m3-marker-motion-cache-guard.json" -EvidencePath ".\proofs\artifacts\m3-marker-motion-p3-p4\ae-cache-guard.json" -RestoreWaitSeconds 45

      - name: Upload P3 P4 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-marker-motion-p3-p4-proof-${{ github.run_id }}
          path: proofs/artifacts/m3-marker-motion-p3-p4/
          if-no-files-found: warn
          retention-days: 14
