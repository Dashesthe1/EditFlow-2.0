name: Dev fix async render marker v3

on:
  push:
    branches:
      - feature/m3-mask-p3-p4-proof
    paths:
      - .github/ae-test-trigger/dev-render-marker-v3.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-mask-p3-p4-proof
          fetch-depth: 0
      - name: Repair scheduled render marker serialization
        run: python .github/scripts/fix_render_marker_v3.py
      - name: Commit fix and remove one-shot materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dev-fix-render-marker-v3.yml
          rm -f .github/ae-test-trigger/dev-render-marker-v3.txt
          rm -f .github/scripts/fix_render_marker_v3.py
          git config user.name 'EditFlow Render Marker Fixer'
          git config user.email 'editflow-builder@users.noreply.github.com'
          git add -A packages/adapters/ae-cep/host/editflow_host_render_async.jsx tests/cep-async-render-m2.test.mjs .github
          git commit -m 'fix: make scheduled render marker serialization durable'
          git push origin HEAD:feature/m3-mask-p3-p4-proof
