name: Dev materialize M3 mask P3 P4 tranche

on:
  push:
    branches:
      - feature/m3-mask-p3-p4-proof
    paths:
      - .github/ae-test-trigger/dev-m3-mask-p3-p4.txt

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/m3-mask-p3-p4-proof
          fetch-depth: 0

      - name: Add proof-only host failure injection and P3/P4 self-hosted wrapper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          host_path = Path('packages/adapters/ae-cep/host/editflow_host_m3_masks.jsx')
          host = host_path.read_text(encoding='utf-8')
          host = host.replace('var BUILD = "0.4.0-dev.1";', 'var BUILD = "0.4.0-dev.2";')
          needle = '''      var result = executePrepared(request, prepared);\n      app.endUndoGroup();'''
          replacement = '''      var result = executePrepared(request, prepared);\n\n      /* Proof-only P4 injection. This branch is unreachable in ordinary product\n       * execution: the self-hosted acceptance runner must explicitly launch AE\n       * with EDITFLOW_M3_MASK_P4_PROOF=1 and the typed request must use the\n       * exact fixed readback profile below. No caller-supplied code is executed.\n       * The induced error occurs after a real mask mutation so the existing\n       * catch/AE-Undo recovery path is exercised rather than another P1 reject.\n       */\n      if (request.command === "mask.set_properties"\n          && request.readbackProfile === "M3_MASK_P4_FAILURE_INJECTION"\n          && $.getenv("EDITFLOW_M3_MASK_P4_PROOF") === "1") {\n        var proofFailure = new Error("Induced M3 mask P4 host failure after mutation.");\n        proofFailure.editflowCategory = "PROOF_INJECTION";\n        proofFailure.editflowCode = "M3_MASK_P4_INDUCED_FAILURE";\n        throw proofFailure;\n      }\n\n      app.endUndoGroup();'''
          if needle not in host:
              raise SystemExit('Expected M3 mask mutation seam was not found.')
          host = host.replace(needle, replacement, 1)
          host_path.write_text(host, encoding='utf-8')

          source = Path('scripts/windows/run-m3-mask-self-hosted.ps1').read_text(encoding='utf-8')
          source = source.replace('run-m3-mask-p1-p2.ps1', 'run-m3-mask-p3-p4.ps1')
          source = source.replace('m3-mask-p1-p2', 'm3-mask-p3-p4')
          source = source.replace('M3 mask P1/P2', 'M3 mask P3/P4')
          source = source.replace('M3 P1/P2', 'M3 P3/P4')
          source = source.replace('P1/P2 proof', 'P3/P4 proof')
          source = source.replace('P1/P2 acceptance', 'P3/P4 acceptance')
          install_needle = '''Write-Host "Installing the checked-out EditFlow CEP bridge before launching the isolated M3 AE proof..."\n& $Installer\n\ntry {'''
          install_replacement = '''Write-Host "Installing the checked-out EditFlow CEP bridge before launching the isolated M3 AE proof..."\n& $Installer\n\n# The host proof hook is inert unless this exact environment flag is inherited by\n# the runner-owned AE process. It is removed again during bounded cleanup.\n$env:EDITFLOW_M3_MASK_P4_PROOF = "1"\nWrite-StartupDiagnostic "P4_PROOF_INJECTION_ARMED" "env=EDITFLOW_M3_MASK_P4_PROOF"\n\ntry {'''
          if install_needle not in source:
              raise SystemExit('Expected M3 installer seam was not found.')
          source = source.replace(install_needle, install_replacement, 1)
          finally_needle = '''} finally {\n  Write-AeProcessSnapshot "CLEANUP_BEGIN"'''
          finally_replacement = '''} finally {\n  Remove-Item Env:EDITFLOW_M3_MASK_P4_PROOF -ErrorAction SilentlyContinue\n  Write-StartupDiagnostic "P4_PROOF_INJECTION_DISARMED" "env=EDITFLOW_M3_MASK_P4_PROOF"\n  Write-AeProcessSnapshot "CLEANUP_BEGIN"'''
          if finally_needle not in source:
              raise SystemExit('Expected M3 cleanup seam was not found.')
          source = source.replace(finally_needle, finally_replacement, 1)
          Path('scripts/windows/run-m3-mask-p3-p4-self-hosted.ps1').write_text(source, encoding='utf-8')
          PY

      - name: Commit materialized tranche files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EditFlow M3 P3-P4 Builder'
          git config user.email 'editflow-builder@users.noreply.github.com'
          git add packages/adapters/ae-cep/host/editflow_host_m3_masks.jsx scripts/windows/run-m3-mask-p3-p4-self-hosted.ps1
          git commit -m 'feat: add M3 mask P3/P4 proof recovery seam and runner'
          git push origin HEAD:feature/m3-mask-p3-p4-proof
