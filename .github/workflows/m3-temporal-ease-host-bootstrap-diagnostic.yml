name: M3 Temporal Ease Host Bootstrap Diagnostic

on:
  push:
    branches:
      - ae-test/m3-temporal-ease-host-diagnostic-control
    paths:
      - .github/ae-test-trigger/m3-temporal-ease-host-diagnostic.txt

permissions:
  contents: read

jobs:
  real-ae-temporal-ease-host-diagnostic:
    runs-on: [self-hosted, Windows, editflow-ae]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run protocol 1.8 host-bootstrap diagnostic
        shell: cmd
        run: |
          @echo off
          if defined EDITFLOW_AFTERFX_PATH (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\run-m3-temporal-ease-self-hosted.ps1" -AfterFxPath "%EDITFLOW_AFTERFX_PATH%" -PreflightHostLoader
          ) else (
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\run-m3-temporal-ease-self-hosted.ps1" -PreflightHostLoader
          )

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-temporal-ease-host-diagnostic-${{ github.run_id }}
          path: proofs/artifacts/m3-temporal-ease-p1-p2/
          if-no-files-found: warn
          retention-days: 14
