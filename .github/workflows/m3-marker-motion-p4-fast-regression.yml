name: M3 Marker Motion P4 Fast Regression
on:
  push:
    branches: [ae-test/m3-marker-motion-p3-p4-fast-control]
    paths: [.github/ae-test-trigger/m3-marker-motion-p4-fast-regression.txt]
permissions:
  contents: read
concurrency:
  group: editflow-accelerated-real-ae-workstation
  cancel-in-progress: false
jobs:
  p4-fast:
    runs-on: [self-hosted, Windows, editflow-ae]
    timeout-minutes: 3
    steps:
      - name: Sync persistent feature source
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $r=Join-Path $env:LOCALAPPDATA "EditFlow2\warm-runner\EditFlow-2.0"
          git -C $r fetch --depth=1 origin m3/marker-motion-p3-p4
          if($LASTEXITCODE -ne 0){throw "fetch failed"}
          git -C $r reset --hard FETCH_HEAD
          if($LASTEXITCODE -ne 0){throw "reset failed"}
          "EDITFLOW_FAST_REPO_ROOT=$r"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify accepted standard protocol 2.0 install path
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:EDITFLOW_FAST_REPO_ROOT "scripts\windows\install-editflow-cep-v20-preview.ps1")
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Run P4 fast regression
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:EDITFLOW_FAST_REPO_ROOT "scripts\windows\run-m3-marker-motion-p4-fast-regression.ps1")
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-marker-motion-p4-fast-regression-${{ github.run_id }}
          path: ${{ env.EDITFLOW_FAST_REPO_ROOT }}\proofs\artifacts\m3-marker-motion-p4-fast-regression\
          if-no-files-found: warn
          retention-days: 30
