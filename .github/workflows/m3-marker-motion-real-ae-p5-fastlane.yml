name: M3 Marker Motion P5 Persistent Warm Transfer

on:
  push:
    branches:
      - ae-test/m3-marker-motion-p3-p4-fast-control
    paths:
      - .github/ae-test-trigger/m3-marker-motion-p5-fastlane.txt

permissions:
  contents: read

concurrency:
  group: editflow-accelerated-real-ae-workstation
  cancel-in-progress: false

jobs:
  p5-transfer:
    runs-on: [self-hosted, Windows, editflow-ae]
    timeout-minutes: 5
    steps:
      - name: Sync persistent feature source
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference="Stop"
          $repoRoot=Join-Path $env:LOCALAPPDATA "EditFlow2\warm-runner\EditFlow-2.0"
          if(-not(Test-Path (Join-Path $repoRoot ".git") -PathType Container)){throw "Persistent warm repo is missing."}
          git -C $repoRoot fetch --depth=1 origin m3/marker-motion-p3-p4
          if($LASTEXITCODE -ne 0){throw "Feature fetch failed."}
          git -C $repoRoot reset --hard FETCH_HEAD
          if($LASTEXITCODE -ne 0){throw "Feature reset failed."}
          Write-Host "Persistent marker-motion P5 source HEAD: $((git -C $repoRoot rev-parse HEAD).Trim())"
          "EDITFLOW_FAST_REPO_ROOT=$repoRoot"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify protocol 2.0 preview remains installed
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $configPath=Join-Path $env:LOCALAPPDATA "EditFlow2\bridge-config.json"
          if(-not(Test-Path $configPath)){throw "Protocol 2.0 preview config missing."}
          $c=Get-Content $configPath -Raw|ConvertFrom-Json
          if(@($c.supportedProtocolVersions) -notcontains "2.0.0"){throw "Installed panel does not advertise protocol 2.0."}
          Write-Host "Protocol 2.0 preview present; keeping current AE process."

      - name: Run marker-motion P5 save reopen reconnect transfer
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:EDITFLOW_FAST_REPO_ROOT "scripts\windows\run-m3-marker-motion-p5-warm.ps1") -TimeoutSeconds 75
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Print P5 result
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $path=Join-Path $env:EDITFLOW_FAST_REPO_ROOT "proofs\artifacts\m3-marker-motion-p5-transfer\result.json"
          if(Test-Path $path){Get-Content $path -Raw|Write-Host}

      - name: Upload P5 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-marker-motion-p5-proof-${{ github.run_id }}
          path: ${{ env.EDITFLOW_FAST_REPO_ROOT }}\proofs\artifacts\m3-marker-motion-p5-transfer\
          if-no-files-found: warn
          retention-days: 90
