name: M3 Marker Motion P3 P4 Acceptance Once

on:
  push:
    branches:
      - ae-test/m3-marker-motion-p3-p4-fast-control
    paths:
      - .github/ae-test-trigger/m3-marker-motion-p3-p4-acceptance-once.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: editflow-accelerated-real-ae-workstation
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: [self-hosted, Windows, editflow-ae]
    steps:
      - name: Sync persistent feature source
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $repoRoot = Join-Path $env:LOCALAPPDATA "EditFlow2\warm-runner\EditFlow-2.0"
          if (-not (Test-Path (Join-Path $repoRoot ".git") -PathType Container)) { throw "Persistent warm repo is missing." }
          git -C $repoRoot fetch --depth=1 origin m3/marker-motion-p3-p4
          if ($LASTEXITCODE -ne 0) { throw "Feature fetch failed." }
          git -C $repoRoot reset --hard FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Feature reset failed." }
          "EDITFLOW_FAST_REPO_ROOT=$repoRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run bounded acceptance proof
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $repoRoot = $env:EDITFLOW_FAST_REPO_ROOT
          $accepted = Join-Path $repoRoot ".accepted\m3-marker-motion-p1-p2\result.json"
          if (-not (Test-Path $accepted -PathType Leaf)) { throw "Pinned accepted P1/P2 result is missing from persistent warm repo." }
          $runRelative = "proofs/artifacts/m3-marker-motion-p3-p4/acceptance-$env:GITHUB_RUN_ID"
          $artifactDir = Join-Path $repoRoot ($runRelative -replace '/', '\')
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          "EDITFLOW_ACCEPTANCE_ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $requestPath = Join-Path $repoRoot (".acceptance-marker-motion-" + $env:GITHUB_RUN_ID + ".json")
          try {
            $request = Get-Content (Join-Path $repoRoot ".github\ae-proof-request\m3-marker-motion-p3-p4.json") -Raw | ConvertFrom-Json
            $request.lifecycle = "REUSE_AE"
            $request.timeoutSeconds = 95
            $request.allowInfrastructureRetry = $false
            $request.artifactDir = $runRelative
            $request | ConvertTo-Json -Depth 8 | Out-File -LiteralPath $requestPath -Encoding utf8
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $repoRoot "scripts\windows\invoke-editflow-ae-proof.ps1") -RequestPath $requestPath -AfterFxPath "C:\Program Files\Adobe\Adobe After Effects 2025\Support Files\AfterFX.exe" -StartupTimeoutSeconds 20
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $requestPath -Force -ErrorAction SilentlyContinue
          }

      - name: Print result
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $path = Join-Path $env:EDITFLOW_ACCEPTANCE_ARTIFACT_DIR "result.json"
          if (Test-Path $path -PathType Leaf) { Get-Content $path -Raw | Write-Host }

      - name: Upload acceptance artifact
        if: always() && env.EDITFLOW_ACCEPTANCE_ARTIFACT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: m3-marker-motion-p3-p4-acceptance-${{ github.run_id }}
          path: ${{ env.EDITFLOW_ACCEPTANCE_ARTIFACT_DIR }}
          if-no-files-found: warn
