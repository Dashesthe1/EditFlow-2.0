name: M3 Temporal Ease P3 P4 Real After Effects

on:
  workflow_dispatch:
    inputs:
      p1_p2_run_id:
        description: Successful M3 temporal-ease P1/P2 workflow run ID whose retained artifact is the accepted dependency
        required: true
        type: string
      afterfx_path:
        description: Optional explicit path to AfterFX.exe
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: editflow-m3-temporal-ease-p3-p4-real-ae-workstation
  cancel-in-progress: false

jobs:
  real-ae-temporal-ease-p3-p4:
    runs-on: [self-hosted, Windows, editflow-ae]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download accepted P1 P2 proof artifact
        uses: actions/download-artifact@v4
        with:
          name: m3-temporal-ease-p1-p2-proof-${{ inputs.p1_p2_run_id }}
          path: .accepted-p1-p2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.p1_p2_run_id }}

      - name: Resolve accepted dependency and run isolated P3 P4 proof
        shell: powershell
        env:
          EDITFLOW_AFTERFX_PATH: ${{ inputs.afterfx_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $Candidates = @(Get-ChildItem -Path ".accepted-p1-p2" -Filter "result.json" -File -Recurse)
          if ($Candidates.Count -ne 1) {
            throw "Expected exactly one downloaded P1/P2 result.json; found $($Candidates.Count)."
          }
          $Accepted = $Candidates[0].FullName
          Write-Host "Using accepted P1/P2 dependency: $Accepted"
          if ($env:EDITFLOW_AFTERFX_PATH) {
            & ".\scripts\windows\run-m3-temporal-ease-p3-p4-self-hosted.ps1" -AfterFxPath $env:EDITFLOW_AFTERFX_PATH -AcceptedP1P2Path $Accepted
          } else {
            & ".\scripts\windows\run-m3-temporal-ease-p3-p4-self-hosted.ps1" -AcceptedP1P2Path $Accepted
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-temporal-ease-p3-p4-proof-${{ github.run_id }}
          path: proofs/artifacts/m3-temporal-ease-p3-p4/
          if-no-files-found: warn
          retention-days: 14
