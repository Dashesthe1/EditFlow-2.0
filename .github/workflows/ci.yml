name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate schemas, typecheck, and test
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee ci-output.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload CI diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostic-${{ github.run_id }}
          path: ci-output.log
          if-no-files-found: error
          retention-days: 1
